  />
  <!-- Check mark -->
  <polyline
    points="192,260 238,308 320,208"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>