  <!-- Inner shield highlight (subtle) -->
  <path
    d="M256 88 C256 88 152 126 152 126 L152 240 C152 308 204 364 256 392 C308 364 360 308 360 240 L360 126 C360 126 256 88 256 88 Z"
    fill="none"
