<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <!-- Background: rounded square (maskable safe zone: content within 80% center) -->
  <rect x="0" y="0" width="192" height="192" rx="36" ry="36" fill="#0A0A0B"/>
  <!-- Shield shape -->
  <path
    d="M96 24 C96 24 48 40 48 40 L48 90 C48 120 72 144 96 156 C120 144 144 120 144 90 L144 40 C144 40 96 24 96 24 Z"
    fill="url(#shieldGrad)"
    stroke="none"
  />
  <!-- Inner shield highlight (subtle) -->
  <path
    d="M96 33 C96 33 57 47 57 47 L57 90 C57 115 76 136 96 147 C116 136 135 115 135 90 L135 47 C135 47 96 33 96 33 Z"
    fill="none"
    stroke="rgba(255,255,255,0.15)"
    stroke-width="1"
  />
  <!-- Check mark -->
  <polyline
    points="72,97 89,115 120,78"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>