<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Offline — TrustNode</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #070709;
        color: #F5F5F0;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      .badge {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: #3B82F6;
        margin-bottom: 16px;
      }
      h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
      p { color: #9CA3AF; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
      button {
        background: #3B82F6;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 28px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: #2563EB; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">TRUSTNODE</div>
      <h1>Вы офлайн</h1>
      <p>Нет подключения к сети. Проверьте соединение и попробуйте ещё раз.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
